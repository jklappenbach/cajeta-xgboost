# GPU probe captures on the self-hosted Windows/NVIDIA runner.
#
# gpu-numeric-fidelity Units 1.1.2 / 2 / 3 need ground truth only real
# hardware can produce (authorized by Julian 2026-07-29: the box behind
# cajeta's release matrix, labels [self-hosted, Windows, X64, gpu]).
#
# Round 1 — device-grad fixtures (1.1.2): probe_device_grads.cu runs the
# verbatim 3.1.2 objective arithmetic on the committed fixture margins and
# uploads device_grad/device_hess npys. Those become the REAL ground truth
# the multi-round grad parity tests were missing (the committed grad.npy is
# a numpy reconstruction).
#
# Later rounds hang off the same harness: the Unit 2 evaluate-kernel gain
# probe (needs the candidate-stats dump first) and the Unit 3 scan probe.
#
# workflow_dispatch only — this ties up Julian's own hardware.

name: gpu-probe

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Comma-separated fixture dirs under tools/fixtures (names containing "multi" run the softmax kernel)'
        required: true
        default: 'tiny_binary,tiny_multi'

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: GPU + toolchain sanity
        shell: pwsh
        run: |
          nvidia-smi -L
          nvcc --version

      # nvcc on Windows needs cl.exe; source the VS build env via vswhere.
      - name: Compile the probe (MSVC host env)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          nvcc -arch=native -O2 tools\gpuprobe\probe_device_grads.cu -o probe_device_grads.exe
          if errorlevel 1 exit /b 1

      - name: Run over the requested fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in "${{ inputs.fixtures }}".Split(',')) {
            $f = $f.Trim()
            $mode = if ($f -like '*multi*') { 'multi' } else { 'binary' }
            $out = "captures/$f"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Write-Host ">> $f ($mode)"
            ./probe_device_grads.exe "tools/fixtures/$f" $mode $out
            if ($LASTEXITCODE -ne 0) { throw "probe failed for $f" }
          }

      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: device-grad-captures
          path: captures/
          if-no-files-found: error
