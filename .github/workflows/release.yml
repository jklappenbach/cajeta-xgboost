# CI + release for the cajeta-xgboost library (.cja).
#
# A pure-Cajeta library: CI installs a published cajeta toolchain, runs the
# suite via ./run-tests.sh (which resolves cajeta-unit itself — sibling
# checkout locally, sha256-verified Olla fetch on a bare runner — and wires
# the fixture/capture env), builds the .cja from the manifest, and — on a v*
# tag — publishes it as a GitHub Release asset and to the signed Olla
# registry.
#
# The probed SFU capture tables (RCP_TABLE / EX2_TABLE, 32 MB each) are
# .gitignore'd and absent in CI: FastMath falls back to correctly-rounded
# math and every capture-dependent test self-skips. Bit-exactness against
# the captures is a local/GPU-runner concern, not this job's.
#
# Triggers (push-to-main flow; no PRs):
#   - push to main         → build + test (no publish)
#   - push a `v*` tag      → build + test + publish (Release + Olla)
#   - workflow_dispatch    → dry-run (build+test) or production (also publishes)

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, production]

permissions:
  contents: write

env:
  # Must match a release tag of jklappenbach/cajeta. v0.13.0 is the line the
  # dev.cajeta.ml 0.3.0 dependency is published against; it also carries the
  # v0.12.1 loader-materialization fix (cross-file records; the Frames bridge
  # test) and v0.12.0's iface-generic-returns dispatch fix.
  CAJETA_VERSION: v0.17.1

jobs:
  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cajeta-xgboost
        uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || true

      - name: Run the test suite
        # No UNIT_REPO here: the bare runner takes run-tests.sh's Olla-fetch
        # path at the dev.cajeta.unit version pinned in cajeta.json.
        timeout-minutes: 30
        run: ./run-tests.sh

      - name: Run the tour (self-checking) + the tour coverage gate
        # The tour asserts every claim it prints and exits non-zero when one
        # stops being true; the gate requires every public type to be
        # exercised by it. Same ml-resolution ladder as the suite — on a bare
        # runner there is no sibling checkout, so it takes the Olla fetch at
        # the dev.cajeta.ml version pinned in cajeta.json.
        timeout-minutes: 30
        run: ./scripts/ci-checks.sh

      - name: Build the release .cja
        id: build
        run: |
          set -euo pipefail
          # cajeta.json is the single source of truth for the version — the
          # deleted VERSION file is the codec-0.7.1-shipped-as-0.7.0 bug class.
          # Read it through the toolchain: the manifest is JSONC, so jq cannot
          # parse it and naive comment-stripping corrupts https:// URLs.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::tag v${tag_version} disagrees with cajeta.json version ${VERSION} — bump the manifest or retag" >&2
              exit 1
            fi
          fi
          cajeta build
          art="build/archive/dev.cajeta.xgboost-${VERSION}.cja"
          [ -f "$art" ] || { echo "::error::expected $art after cajeta build" >&2; exit 1; }
          echo "artifact=$art" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload .cja as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-xgboost-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.artifact }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.build.outputs.version) }}
          name: cajeta-xgboost ${{ steps.build.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.artifact }}

      # Signed publish to the Olla registry (olla.cajeta.dev). Requires the
      # OLLA_* repo secrets; until they are set on THIS repo, releases are
      # bridged via cajeta-logging's publish-sibling workflow (authorized
      # 2026-07-29), and this step skips with a loud warning instead of
      # failing the cut. Secrets cannot appear in `if:` directly, hence the
      # detect step.
      - name: Detect Olla credentials
        id: creds
        env:
          T: ${{ secrets.OLLA_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no OLLA_* secrets on this repo — the Olla publish is SKIPPED; bridge via cajeta-logging's publish-sibling or add the secrets"
          fi

      - name: Publish to Olla
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')) && steps.creds.outputs.have == 'true'
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.artifact }}
          version: ${{ steps.build.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
